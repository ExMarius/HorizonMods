<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disc GD-3.2 – JSON candidat</title><style>body{margin:0;background:#10191c;color:#f0f4ee;font:15px system-ui}header{padding:15px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}h1{font-size:20px;margin:0 0 5px}p{margin:0;color:#b9c9bf}button{padding:9px 13px;border:1px solid #718d7b;border-radius:6px;background:#30463a;color:#fff;cursor:pointer}#view{height:calc(100vh - 90px);min-height:400px;position:relative}canvas{display:block}#status{position:absolute;left:16px;top:12px;color:#283830}</style><script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body><header><div><h1>Disc GD-3.2 — piesele JSON pentru Minecraft</h1><p>Variantă de lucru, nu modelul confirmat; nu este instalată în joc.</p></div><div><button id="couple">Decuplează</button> <button id="mode">Coboară pentru lucru</button> <button id="spin">Oprește mișcarea</button></div></header><div id="view"><span id="status">Se încarcă…</span></div><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const v=document.querySelector('#view'),scene=new T.Scene();scene.background=new T.Color('#b9c9b7');const c=new T.PerspectiveCamera(38,1,.01,100),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=T.SRGBColorSpace;v.append(r.domElement);const ctl=new OrbitControls(c,r.domElement);ctl.target.set(0,.5,0);ctl.enableDamping=true;c.position.set(5,3,5.5);ctl.update();scene.add(new T.HemisphereLight(0xffffff,0x788673,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(3,8,5);scene.add(light);const colors={blue:'#1e6bb8',darkblue:'#174c83',dark:'#262626',steel:'#c8d0d8',rubber:'#1e1e1e',cream:'#e6dcc5',weight:'#3a3a3a'},materials=Object.fromEntries(Object.entries(colors).map(([k,x])=>[k,new T.MeshStandardMaterial({color:x,roughness:.65,metalness:k==='steel'?.55:0})]));
function addModel(model,parent){const group=new T.Group();group.scale.setScalar(2/16);parent.add(group);for(const e of model.elements){const size=e.to.map((v,i)=>v-e.from[i]),center=e.to.map((v,i)=>(v+e.from[i])/2-8),geo=new T.BoxGeometry(...size),mesh=new T.Mesh(geo,materials[e.faces.up.texture.slice(1)]);if(e.rotation){let pivot=new T.Group(),o=e.rotation.origin.map(x=>x-8);pivot.position.set(...o);mesh.position.set(...center.map((v,i)=>v-o[i]));pivot.rotation[e.rotation.axis]=e.rotation.angle*Math.PI/180;pivot.add(mesh);group.add(pivot)}else{mesh.position.set(...center);group.add(mesh)}}}
let liftRoot=new T.Group();scene.add(liftRoot);let spinning=[],wheels=[],axis=new T.Group();liftRoot.add(axis);let progress=1,transport=true,running=true,coupled=true,jack=null;try{const names=['body','gang_frame','gang_front','gang_rear','wheel','axle','jack'],list=await Promise.all(names.map(n=>fetch('/candidate/gd32_'+n+'.json').then(r=>{if(!r.ok)throw Error(n+' nu a putut fi citit');return r.json()}))),m=Object.fromEntries(names.map((n,i)=>[n,list[i]]));addModel(m.body,liftRoot);for(const front of [true,false])for(const side of [-1,1]){const sign=(front?(side<0?1:-1):(side<0?-1:1)),group=new T.Group();group.position.set(side*13.5/16,0,(front?-12.5:10.5)/16);group.rotation.y=-sign*Math.PI/10;liftRoot.add(group);addModel(m.gang_frame,group);const rotor=new T.Group();rotor.position.y=4.2/16;group.add(rotor);addModel(front?m.gang_front:m.gang_rear,rotor);spinning.push(rotor)}jack=new T.Group();jack.position.set(0,0,-26/16);jack.visible=false;liftRoot.add(jack);addModel(m.jack,jack);addModel(m.axle,axis);for(const side of [-1,1]){const wheel=new T.Group();wheel.position.x=side*12/16;axis.add(wheel);addModel(m.wheel,wheel);wheels.push(wheel)}document.querySelector('#status').textContent='Piese generate: cadru, baterii, roți și axă · necesită comparație vizuală';}catch(e){document.querySelector('#status').textContent='Eroare: '+e.message;console.error(e)}
const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:'#8d9e7f'}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new T.GridHelper(20,20,0x6b806c,0x9aa997);grid.position.y=.001;scene.add(grid);document.querySelector('#couple').onclick=e=>{coupled=!coupled;if(jack)jack.visible=!coupled;if(!coupled){transport=true;document.querySelector('#mode').textContent='Coboară pentru lucru'}e.target.textContent=coupled?'Decuplează':'Cupează'};document.querySelector('#mode').onclick=e=>{if(!coupled)return;transport=!transport;e.target.textContent=transport?'Coboară pentru lucru':'Ridică pentru transport'};document.querySelector('#spin').onclick=e=>{running=!running;e.target.textContent=running?'Oprește mișcarea':'Pornește mișcarea'};new ResizeObserver(()=>{c.aspect=v.clientWidth/v.clientHeight;c.updateProjectionMatrix();r.setSize(v.clientWidth,v.clientHeight)}).observe(v);function tick(){requestAnimationFrame(tick);progress+=(Number(transport)-progress)*.07;liftRoot.position.y=progress*4.5/16;if(jack)jack.position.y=-liftRoot.position.y;axis.position.set(0,(5.5-progress*4.5)/16,-1/16);if(running){wheels.forEach(w=>w.rotation.x-=.015);if(!transport)spinning.forEach(g=>g.rotation.x-=.015)}ctl.update();r.render(scene,c)}tick();
</script></body></html>
