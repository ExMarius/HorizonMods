[mod]
id = "gokart_native"
version = "0.13.7"
priority = 100

# Planned and verified against Horizon Nightly 2026-11-16 (`9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0`, NATIVE_HOOKS_API = 415).
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# Pure-Rust Go-Kart physics, tuning, fuel, persistence, and network codecs (`cargo test`).
[[module]]
id = "rules"
file = "crates/horizon-client/src/game.rs"
name = "gokart"
source = "runtime.rs"

# Game integration glue (spawning, 20-TPS physics, 3D rendering, HUD, Garage GUI, localization).
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "gokart_glue"
source = "glue.rs"

# Embedded content mod (`data/gokart-content.hmod`), extracted once to `.horizon-cache` so the `.hnmod` is standalone.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "disabled", ty = "&std::collections::BTreeSet<String>", value = "disabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# Custom item components, items, standalone 3D vehicle models, and Mods page row.
[[injection]]
id = "component-types"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_component_types"
helper = "component_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<String>", value = "&mut *types" },
]

[[injection]]
id = "items"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_items"
helper = "items.rs"
bindings = [
  { name = "items", ty = "&mut Vec<horizon_mods::content::Item>", value = "&mut *items" },
]

[[injection]]
id = "standalone-models"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_standalone_models"
helper = "standalone_models.rs"
bindings = [
  { name = "models", ty = "&mut Vec<String>", value = "&mut *models" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<horizon_client::mod_api::NativeMod>", value = "&mut *mods" },
]

# Commands (`/gokart [kit | spawn | fuel | paint <color>]`).
[[injection]]
id = "register"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<horizon_client::mod_api::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&horizon_client::mod_api::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

