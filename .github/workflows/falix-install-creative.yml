name: Install November 5 creative checkpoint
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: [.github/workflows/falix-install-creative.yml, paper-vehicles/deploy/falix_install_creative.py]
permissions:
  contents: read
  id-token: write
concurrency:
  group: falix-vehicle-deploy
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/arena/fb5f91ff-horizonmods' && startsWith(github.event.head_commit.message, 'Install November 5 creative checkpoint')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact November 5 revision
        run: |
          curl -fsSL https://codeload.github.com/ExMarius/MrCrayfishVehicleMod/tar.gz/50583bb8618b8ad0b94e6e3aa5e28ea7dae761e5 -o /tmp/source.tar.gz
          mkdir /tmp/nov5
          tar -xzf /tmp/source.tar.gz -C /tmp/nov5 --strip-components=1
          grep -F 'case "creative"' /tmp/nov5/paper-plugin/src/main/java/com/mrcrayfish/vehicle/paper/command/VehicleCommand.java
      - name: Build and run tests
        run: /tmp/nov5/paper-plugin/gradlew -p /tmp/nov5/paper-plugin clean build
      - name: Test startup and persistence on disposable Paper server
        run: bash /tmp/nov5/tools/test_fresh_paper_server.sh /tmp/nov5/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
      - name: Back up server files and install verified build
        run: python3 paper-vehicles/deploy/falix_install_creative.py /tmp/nov5/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
