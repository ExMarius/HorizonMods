name: Verify and back up selected vehicle baseline
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: [.github/workflows/falix-backup-good-baseline.yml, paper-vehicles/deploy/falix_backup_good_baseline.py]
permissions:
  contents: read
  id-token: write
concurrency:
  group: falix-vehicle-deploy
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/arena/fb5f91ff-horizonmods' && startsWith(github.event.head_commit.message, 'Verify and back up selected vehicle baseline')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test checked-in baseline
        run: ./vehicle-plugin-nov5/paper-plugin/gradlew -p vehicle-plugin-nov5/paper-plugin clean build
      - name: Compare installed bytecode and back up active files
        run: python3 paper-vehicles/deploy/falix_backup_good_baseline.py vehicle-plugin-nov5/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
