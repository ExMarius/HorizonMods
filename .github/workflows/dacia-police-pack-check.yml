name: Check Dacia police resource conversion
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: ['vehicle-plugin-horizon/next-vehicle/prepare_police.py', 'vehicle-plugin-horizon/next-vehicle/test_prepare_police.py', '.github/workflows/dacia-police-pack-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test converter
        run: python3 -m unittest discover -s vehicle-plugin-horizon/next-vehicle -p test_prepare_police.py -v
      - name: Verify against current published pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download horizon-offroader-45396585154 --repo ExMarius/HorizonMods --pattern HorizonOffRoader-1.21.4.zip --dir /tmp
          python3 vehicle-plugin-horizon/next-vehicle/prepare_police.py /tmp/HorizonOffRoader-1.21.4.zip paper-vehicles/transfer/vehicle-reference/vehicle-fara-mentiune.zip /tmp/dacia-police-pack.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/HorizonOffRoader-1.21.4.zip') as base, zipfile.ZipFile('/tmp/dacia-police-pack.zip') as result:
              assert result.testzip() is None
              assert set(base.namelist()).issubset(result.namelist())
              for name in base.namelist():
                  assert base.read(name) == result.read(name), name
              print('All existing pack entries preserved:', len(base.namelist()))
          PY
