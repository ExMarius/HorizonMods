name: Paper vehicles build

on:
  push:
    paths:
      - 'paper-vehicles/**'
      - 'content/assets/gokart/**'
      - 'LICENSE'
      - '.github/workflows/paper-vehicles.yml'
  pull_request:
    paths:
      - 'paper-vehicles/**'
      - 'content/assets/gokart/**'
      - 'LICENSE'
      - '.github/workflows/paper-vehicles.yml'
  workflow_dispatch:
    inputs:
      install_new_cab:
        description: Back up and install the approved recovery cab
        type: boolean
        default: false
      diagnose_recovery:
        description: Read crash diagnostics without changing the server
        type: boolean
        default: false
      deploy_recovery:
        description: Install the prebuilt recovery candidate on the test server
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install model converter dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Offline asset and catalog checks
        run: python3 -m unittest discover -s paper-vehicles/tests -v
      - name: Build Paper development plugin
        run: |
          set -o pipefail
          ./paper-vehicles/gradlew -p paper-vehicles build 2>&1 | tee /tmp/paper-build.log || {
            python3 -c "from pathlib import Path; lines=Path('/tmp/paper-build.log').read_text().splitlines(); print('::error::' + ' | '.join(line.replace('%','%25').replace('\r','%0D').replace('\n','%0A') for line in lines[-30:])[:10000])"
            exit 1
          }
      - name: Upload development jar
        uses: actions/upload-artifact@v4
        with:
          name: HorizonVehiclesPaper-development
          path: paper-vehicles/build/libs/HorizonVehiclesPaper-*.jar
          if-no-files-found: error
          retention-days: 14

  recovery-package:
    if: github.event_name == 'workflow_dispatch' && !inputs.deploy_recovery && !inputs.diagnose_recovery && !inputs.install_new_cab
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile recovery JAR without tests
        run: ./vehicle-plugin-horizon/paper-plugin/gradlew -p vehicle-plugin-horizon/paper-plugin clean jar
      - name: Build visual pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/recovery-pack
          gh release download horizon-offroader-45724921999 --repo ExMarius/HorizonMods --pattern HorizonOffRoader-1.21.4.zip --dir /tmp/recovery-pack
          python3 vehicle-plugin-horizon/next-vehicle/atelier-flota/minecraft/build_pack.py /tmp/recovery-pack/HorizonOffRoader-1.21.4.zip /tmp/recovery-pack/HorizonRecovery-candidate.zip --expected-sha1 136f003f9c56ee849881d41fb6697876353b5681
          sha256sum vehicle-plugin-horizon/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Recovery-install-candidate
          path: |
            vehicle-plugin-horizon/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
            /tmp/recovery-pack/HorizonRecovery-candidate.zip
          if-no-files-found: error
          retention-days: 14

  recovery-install:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_recovery && !inputs.diagnose_recovery && !inputs.install_new_cab
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: falix-vehicle-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile JAR without tests
        run: ./vehicle-plugin-horizon/paper-plugin/gradlew -p vehicle-plugin-horizon/paper-plugin clean jar
      - name: Install JAR on test server
        run: python3 paper-vehicles/deploy/falix_recovery_live_jar.py vehicle-plugin-horizon/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar

  recovery-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_recovery && !inputs.install_new_cab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read recent crash and server log diagnostics
        run: python3 paper-vehicles/deploy/falix_recovery_crash_diagnostic.py

  install-recovery-cab:
    if: github.event_name == 'workflow_dispatch' && inputs.install_new_cab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: falix-vehicle-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile JAR and build resource pack without synthetic tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./vehicle-plugin-horizon/paper-plugin/gradlew -p vehicle-plugin-horizon/paper-plugin clean jar
          mkdir -p /tmp/recovery-base /tmp/recovery-old /tmp/recovery-new
          gh release download horizon-offroader-45724921999 --repo ExMarius/HorizonMods --pattern HorizonOffRoader-1.21.4.zip --dir /tmp/recovery-base
          gh release download horizon-offroader-46053993999 --repo ExMarius/HorizonMods --pattern HorizonOffRoader-1.21.4.zip --dir /tmp/recovery-old
          python3 vehicle-plugin-horizon/next-vehicle/atelier-flota/minecraft/build_pack.py /tmp/recovery-base/HorizonOffRoader-1.21.4.zip /tmp/recovery-new/HorizonOffRoader-1.21.4.zip --expected-sha1 136f003f9c56ee849881d41fb6697876353b5681
      - name: Back up current JAR, pack and configuration
        run: |
          set -o pipefail
          python3 paper-vehicles/deploy/falix_recovery_cab_install.py backup /tmp/recovery-old/HorizonOffRoader-1.21.4.zip 2>&1 | tee /tmp/cab-backup.log || {
            python3 -c "from pathlib import Path; s=Path('/tmp/cab-backup.log').read_text().splitlines(); print('::error::'+' | '.join(x for x in s[-12:] if not x.startswith('::add-mask::')).replace('%','%25')[:5000])"
            exit 1
          }
      - name: Publish approved resource pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="horizon-offroader-${GITHUB_RUN_ID}"
          gh release create "$tag" /tmp/recovery-new/HorizonOffRoader-1.21.4.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Recovery cab resource pack' --notes 'Approved cab concept adapted for in-game testing.'
          echo "PACK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/HorizonOffRoader-1.21.4.zip" >> "$GITHUB_ENV"
      - name: Install matching JAR and resource pack
        run: python3 paper-vehicles/deploy/falix_recovery_cab_install.py install vehicle-plugin-horizon/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar /tmp/recovery-new/HorizonOffRoader-1.21.4.zip "$PACK_URL"
