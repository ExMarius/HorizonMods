name: Test Dacia police integration
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: ['vehicle-plugin-horizon/paper-plugin/**', 'vehicle-plugin-horizon/tools/smoke_police.*', '.github/workflows/dacia-police-integration.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and run unit tests
        run: |
          set -o pipefail
          ./vehicle-plugin-horizon/paper-plugin/gradlew -p vehicle-plugin-horizon/paper-plugin clean build 2>&1 | tee /tmp/build-dacia.log || {
            python3 -c "from pathlib import Path; print('::error::'+' | '.join(Path('/tmp/build-dacia.log').read_text().splitlines()[-45:]).replace('%','%25')[:8000])"
            exit 1
          }
      - name: Test driver, passengers, siren command and persistence
        run: |
          npm install --prefix /tmp/horizon-test mineflayer@4.39.0
          export NODE_PATH=/tmp/horizon-test/node_modules
          set -o pipefail
          python3 vehicle-plugin-horizon/tools/smoke_police.py vehicle-plugin-horizon/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar 2>&1 | tee /tmp/smoke-police.log || {
            python3 -c "from pathlib import Path; print('::error::'+' | '.join(Path('/tmp/smoke-police.log').read_text().splitlines()[-25:]).replace('%','%25')[:8000])"
            exit 1
          }
