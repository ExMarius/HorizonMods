name: Audit vanilla 1.21.4 boat bytecode
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper-vehicles/tools/audit_vanilla_boat.py'
      - '.github/workflows/vanilla-boat-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/arena/fb5f91ff-horizonmods'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Mojang downloads and inspect boat methods
        run: python3 paper-vehicles/tools/audit_vanilla_boat.py | tee /tmp/boat-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-boat-bytecode-audit
          path: /tmp/boat-audit.txt
          retention-days: 7
