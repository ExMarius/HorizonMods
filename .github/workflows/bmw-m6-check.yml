name: Verify BMW M6 candidate
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths:
      - 'vehicle-plugin-horizon/next-vehicle/bmw-m6/**'
      - 'vehicle-plugin-horizon/paper-plugin/**'
      - 'vehicle-plugin-horizon/tools/smoke_bmw_m6.*'
      - '.github/workflows/bmw-m6-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify conversion and pack isolation
        run: python3 -m unittest discover -s vehicle-plugin-horizon/next-vehicle/bmw-m6 -p 'test_*.py' -v
      - name: Build and test plugin
        run: ./vehicle-plugin-horizon/paper-plugin/gradlew -p vehicle-plugin-horizon/paper-plugin clean build
      - name: Spawn, drive and reload BMW on disposable Paper server
        run: |
          npm install --prefix /tmp/bmw-test mineflayer@4.39.0
          export NODE_PATH=/tmp/bmw-test/node_modules
          python3 vehicle-plugin-horizon/tools/smoke_bmw_m6.py vehicle-plugin-horizon/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
