name: Plugin checkpoint
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download currently configured public resource pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/checkpoint-pack
          gh release download horizon-offroader-46057404122 --repo "$GITHUB_REPOSITORY" --pattern HorizonOffRoader-1.21.4.zip --dir /tmp/checkpoint-pack
      - name: Capture and verify plugin checkpoint on test server
        env:
          CHECKPOINT_PACK: /tmp/checkpoint-pack/HorizonOffRoader-1.21.4.zip
        run: python3 paper-vehicles/deploy/falix_plugin_checkpoint.py
