name: Verify Logan redesign
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: ['vehicle-plugin-horizon/next-vehicle/redesign_logan.py', 'vehicle-plugin-horizon/next-vehicle/test_redesign_logan.py', 'vehicle-plugin-horizon/next-vehicle/assets/redesign/**', '.github/workflows/logan-redesign-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s vehicle-plugin-horizon/next-vehicle -p test_redesign_logan.py -v
      - name: Verify installed pack and untouched resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download horizon-offroader-45406628530 --repo ExMarius/HorizonMods --pattern HorizonOffRoader-1.21.4.zip --dir /tmp/base
          python3 vehicle-plugin-horizon/next-vehicle/redesign_logan.py /tmp/base/HorizonOffRoader-1.21.4.zip /tmp/redesign.zip
          python3 - <<'PY'
          import zipfile
          changed={'assets/daciapolice/models/item/body.json','assets/daciapolice/models/item/body_flash_0.json','assets/daciapolice/models/item/body_flash_1.json','assets/daciapolice/textures/item/logan_livery.png'}
          with zipfile.ZipFile('/tmp/base/HorizonOffRoader-1.21.4.zip') as a, zipfile.ZipFile('/tmp/redesign.zip') as b:
              assert b.testzip() is None and set(a.namelist()).issubset(b.namelist())
              for n in a.namelist():
                  if n not in changed: assert a.read(n)==b.read(n),n
              print('Pack preserved:',len(a.namelist()),'entries; only four Dacia resources modified')
          PY
