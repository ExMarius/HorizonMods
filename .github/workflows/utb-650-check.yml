name: Verify UTB 650 tractor
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: ['.github/workflows/utb-650-check.yml', 'vehicle-plugin-horizon/next-vehicle/utb/**', 'vehicle-plugin-horizon/paper-plugin/**', 'vehicle-plugin-horizon/tools/smoke_utb_650.*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit-test model and pack safety
        run: python3 -m unittest discover -s vehicle-plugin-horizon/next-vehicle/utb -p 'test_*.py' -v
      - name: Verify additions against deployed pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download horizon-offroader-45510103071 --repo ExMarius/HorizonMods --pattern HorizonOffRoader-1.21.4.zip --dir /tmp/base
          python3 vehicle-plugin-horizon/next-vehicle/utb/update_utb_body.py /tmp/base/HorizonOffRoader-1.21.4.zip /tmp/utb-pack.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/base/HorizonOffRoader-1.21.4.zip') as old,zipfile.ZipFile('/tmp/utb-pack.zip') as new:
              assert new.testzip() is None and set(old.namelist()).issubset(new.namelist())
              for name in old.namelist():
                  if name != 'assets/vehicle/models/item/utb_650_body.json': assert old.read(name)==new.read(name),name
          PY
      - name: Build plugin and unit tests
        run: ./vehicle-plugin-horizon/paper-plugin/gradlew -p vehicle-plugin-horizon/paper-plugin clean build
      - name: Test tractor and existing vehicles
        run: |
          npm install --prefix /tmp/horizon-test mineflayer@4.39.0
          export NODE_PATH=/tmp/horizon-test/node_modules
          for test in smoke_utb_650 smoke_horizon_kart smoke_police smoke_off_roader; do
            set -o pipefail
            python3 "vehicle-plugin-horizon/tools/${test}.py" vehicle-plugin-horizon/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar 2>&1 | tee /tmp/utb-smoke.log || {
              python3 -c "from pathlib import Path; print('::error::'+' | '.join([x for x in Path('/tmp/utb-smoke.log').read_text().splitlines() if 'Active data:' in x or 'Garage data:' in x or 'HorizonBot' in x or 'Garaj' in x or 'vehicle' in x.lower() or 'utb' in x.lower() or 'error' in x.lower()][-45:]).replace('%','%25')[:8000])"
              exit 1
            }
          done
