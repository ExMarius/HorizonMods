name: Configure vehicle pack for Paper 1.21.4
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: [.github/workflows/falix-configure-pack.yml, paper-vehicles/deploy/falix_configure_pack.py]
permissions:
  contents: read
  id-token: write
concurrency:
  group: falix-vehicle-deploy
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/arena/fb5f91ff-horizonmods' && startsWith(github.event.head_commit.message, 'Configure 1.21.4 vehicle resource pack')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download pack as an unauthenticated Minecraft client
        run: |
          curl --fail --show-error --location --retry 2 --max-time 90 -o /tmp/vehicle-pack.zip 'https://github.com/ExMarius/MrCrayfishVehicleMod/releases/download/paper-plugin/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r39.zip'
      - name: Verify pack, configure server and restart
        run: python3 paper-vehicles/deploy/falix_configure_pack.py /tmp/vehicle-pack.zip
