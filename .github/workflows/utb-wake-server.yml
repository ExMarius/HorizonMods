name: Wake server for UTB installation
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: ['.github/workflows/utb-wake-server.yml']
permissions:
  contents: read
  id-token: write
concurrency:
  group: falix-vehicle-deploy
  cancel-in-progress: false
jobs:
  wake:
    if: startsWith(github.event.head_commit.message, 'Wake server for UTB')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wake only if sleeping
        run: |
          python3 - <<'PY'
          import importlib.util,time
          spec=importlib.util.spec_from_file_location('f','paper-vehicles/deploy/falix_auto_update.py')
          f=importlib.util.module_from_spec(spec);spec.loader.exec_module(f)
          a=f.Falix(f.login());state=a.status();print('::notice::Initial server state: '+str(state),flush=True)
          if state=='sleeping':
              a.api('/power',{'signal':'start'},'POST')
              print('::notice::Start requested',flush=True)
              for _ in range(24):
                  time.sleep(5);state=a.status()
                  if state in ('running','offline'):break
          print('::notice::Final server state: '+str(state),flush=True)
          if state not in ('running','offline'):raise SystemExit('Server not ready for installation')
          PY
