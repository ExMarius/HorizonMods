name: Deploy reversible 1.21.4 sync experiment
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: [.github/workflows/falix-sync-experiment.yml, paper-vehicles/deploy/falix_deploy_sync.py]
permissions:
  contents: read
  id-token: write
concurrency:
  group: falix-vehicle-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/arena/fb5f91ff-horizonmods' && startsWith(github.event.head_commit.message, 'Deploy 1.21.4 reversible sync experiment')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test deployment safety
        run: python3 -m unittest discover -s paper-vehicles/tests -p test_falix_auto_update.py -v
      - name: Build and test 1.21.4 plugin
        working-directory: vehicle-plugin-1.21.4
        run: ./paper-plugin/gradlew -p paper-plugin clean build
      - name: Backup and deploy over November baseline
        run: python3 paper-vehicles/deploy/falix_deploy_sync.py vehicle-plugin-1.21.4/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
