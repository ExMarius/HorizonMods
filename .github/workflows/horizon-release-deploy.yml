name: Build and install Horizon Off-Roader
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: [.github/workflows/horizon-release-deploy.yml, paper-vehicles/deploy/falix_install_horizon.py]
permissions:
  contents: write
  id-token: write
concurrency:
  group: falix-vehicle-deploy
  cancel-in-progress: false
jobs:
  deliver:
    if: github.ref == 'refs/heads/arena/fb5f91ff-horizonmods' && startsWith(github.event.head_commit.message, 'Deliver Horizon Off-Roader on Paper')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test pack merge and deployment safeguards
        run: |
          python3 -m unittest discover -s vehicle-plugin-nov5/tests -v
          python3 -m unittest discover -s paper-vehicles/tests -p test_off_roader_transfer.py -v
          python3 -m unittest discover -s paper-vehicles/tests -p test_falix_install_horizon.py -v
          python3 vehicle-plugin-horizon/generate_groups.py
          git diff --exit-code -- vehicle-plugin-horizon/paper-plugin/src/main/java/com/mrcrayfish/vehicle/paper/render/HorizonGroups.java
      - name: Build and test plugin
        run: ./vehicle-plugin-horizon/paper-plugin/gradlew -p vehicle-plugin-horizon/paper-plugin clean build
      - name: Exercise vehicle on a disposable Paper 1.21.4 server
        run: |
          npm install --prefix /tmp/horizon-test mineflayer@4.39.0
          export NODE_PATH=/tmp/horizon-test/node_modules
          set -o pipefail
          python3 vehicle-plugin-horizon/tools/smoke_off_roader.py vehicle-plugin-horizon/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar 2>&1 | tee /tmp/smoke.log || {
            python3 -c "from pathlib import Path; print('::error::' + ' | '.join(Path('/tmp/smoke.log').read_text().splitlines()[-20:]).replace('%','%25')[:8000])"
            exit 1
          }
      - name: Create candidate pack from exact r39
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download vehicle-plugin-prototype-v0.1.0 --repo ExMarius/MrCrayfishVehicleMod --pattern MrCrayfishVehiclePlugin-resource-pack-1.21.4-r39.zip --dir /tmp
          python3 vehicle-plugin-nov5/tools/merge_horizon_pack.py /tmp/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r39.zip paper-vehicles/transfer/off-roader/horizon-off-roader-transfer.zip /tmp/HorizonOffRoader-1.21.4.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r39.zip') as old, zipfile.ZipFile('/tmp/HorizonOffRoader-1.21.4.zip') as new:
              for n in old.namelist():
                  if not n.endswith('/'): assert old.read(n)==new.read(n), n
              assert new.testzip() is None
          PY
          cp vehicle-plugin-horizon/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar /tmp/HorizonVehicles-1.21.4.jar
      - name: Publish matching JAR and pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="horizon-offroader-${GITHUB_RUN_ID}"
          gh release create "$tag" /tmp/HorizonVehicles-1.21.4.jar /tmp/HorizonOffRoader-1.21.4.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Horizon Off-Roader for Paper 1.21.4' --notes 'Separate Horizon Off-Roader on the selected November 5 baseline. Includes the r39 pack plus Horizon assets. Server and protocol tests passed; vanilla visual appearance, seat and camera still require real client verification. Off-road wheels use the standard Horizon wheel visual. Source is in vehicle-plugin-horizon.'
          echo "PACK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/HorizonOffRoader-1.21.4.zip" >> "$GITHUB_ENV"
      - name: Verify published pack is publicly downloadable and exact
        run: |
          curl -fsSL --retry 3 "$PACK_URL" -o /tmp/public-pack.zip
          cmp /tmp/public-pack.zip /tmp/HorizonOffRoader-1.21.4.zip
      - name: Back up and install matching plugin and pack
        run: python3 paper-vehicles/deploy/falix_install_horizon.py /tmp/HorizonVehicles-1.21.4.jar /tmp/HorizonOffRoader-1.21.4.zip "$PACK_URL"
