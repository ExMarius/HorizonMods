name: Validate Horizon Off-Roader pack merge
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: ['vehicle-plugin-nov5/tools/**', 'vehicle-plugin-nov5/tests/**', '.github/workflows/horizon-pack-integration.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run merge safety and conversion tests
        run: |
          python3 -m unittest discover -s vehicle-plugin-nov5/tests -v
          python3 -m unittest discover -s paper-vehicles/tests -p test_off_roader_transfer.py -v
      - name: Download exact r39 pack and create local candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download vehicle-plugin-prototype-v0.1.0 --repo ExMarius/MrCrayfishVehicleMod --pattern MrCrayfishVehiclePlugin-resource-pack-1.21.4-r39.zip --dir /tmp
          python3 vehicle-plugin-nov5/tools/merge_horizon_pack.py /tmp/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r39.zip paper-vehicles/transfer/off-roader/horizon-off-roader-transfer.zip /tmp/candidate-pack.zip
      - name: Verify every original resource is unchanged
        run: |
          python3 - <<'PY'
          import zipfile
          old='/tmp/MrCrayfishVehiclePlugin-resource-pack-1.21.4-r39.zip'
          new='/tmp/candidate-pack.zip'
          with zipfile.ZipFile(old) as a, zipfile.ZipFile(new) as b:
              for n in a.namelist():
                  if not n.endswith('/'):
                      assert a.read(n)==b.read(n), n
              assert b.testzip() is None
              print(f'::notice::All {len(a.namelist())} original ZIP entries preserved; candidate remains local to CI')
          PY
