name: Verify Logan geometry repair
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: ['vehicle-plugin-horizon/next-vehicle/repair_logan_body.py', 'vehicle-plugin-horizon/next-vehicle/test_repair_logan_body.py', '.github/workflows/logan-repair-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify floor, seat alignment, hood and coplanar faces
        run: python3 -m unittest discover -s vehicle-plugin-horizon/next-vehicle -p test_repair_logan_body.py -v
      - name: Verify selected pack and unchanged resources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download horizon-offroader-45411366753 --repo ExMarius/HorizonMods --pattern HorizonOffRoader-1.21.4.zip --dir /tmp/base
          python3 vehicle-plugin-horizon/next-vehicle/repair_logan_body.py /tmp/base/HorizonOffRoader-1.21.4.zip /tmp/repaired.zip
          python3 - <<'PY'
          import zipfile
          changed={'assets/daciapolice/models/item/body.json','assets/daciapolice/models/item/body_flash_0.json','assets/daciapolice/models/item/body_flash_1.json'}
          with zipfile.ZipFile('/tmp/base/HorizonOffRoader-1.21.4.zip') as a,zipfile.ZipFile('/tmp/repaired.zip') as b:
              assert b.testzip() is None and set(a.namelist())==set(b.namelist())
              for n in a.namelist():
                  if n not in changed:assert a.read(n)==b.read(n),n
              print('Untouched entries:',len(a.namelist())-len(changed))
          PY
