name: Verify new Logan body
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: ['vehicle-plugin-horizon/next-vehicle/custom_logan_body.py', 'vehicle-plugin-horizon/next-vehicle/test_custom_logan_body.py', '.github/workflows/custom-logan-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test body, seats, wheel openings and siren variants
        run: python3 -m unittest discover -s vehicle-plugin-horizon/next-vehicle -p test_custom_logan_body.py -v
      - name: Verify previous production pack and all unrelated assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download horizon-offroader-45409075758 --repo ExMarius/HorizonMods --pattern HorizonOffRoader-1.21.4.zip --dir /tmp/base
          python3 vehicle-plugin-horizon/next-vehicle/custom_logan_body.py /tmp/base/HorizonOffRoader-1.21.4.zip /tmp/custom-logan.zip
          python3 - <<'PY'
          import json,zipfile
          changed={'assets/daciapolice/models/item/body.json','assets/daciapolice/models/item/body_flash_0.json','assets/daciapolice/models/item/body_flash_1.json'}
          with zipfile.ZipFile('/tmp/base/HorizonOffRoader-1.21.4.zip') as a,zipfile.ZipFile('/tmp/custom-logan.zip') as b:
              assert b.testzip() is None and set(a.namelist()).issubset(b.namelist())
              for n in a.namelist():
                  if n not in changed:assert a.read(n)==b.read(n),n
              m=json.loads(b.read('assets/daciapolice/models/item/body.json'))
              assert len(m['elements'])>=100
              for ref in m['textures'].values():
                  namespace,path=ref.split(':');assert 'assets/'+namespace+'/textures/'+path+'.png' in b.namelist(),ref
              print('Pack verified; untouched entries:',len(a.namelist())-len(changed))
          PY
