name: Deploy vehicle synchronization update
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: [.github/workflows/falix-sync-fix.yml, paper-vehicles/deploy/falix_deploy_sync_fix.py]
permissions:
  contents: read
  id-token: write
concurrency:
  group: falix-vehicle-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/arena/fb5f91ff-horizonmods' && startsWith(github.event.head_commit.message, 'Deploy vehicle synchronization update')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test Paper 1.21.4
        working-directory: vehicle-plugin-1.21.4
        run: ./paper-plugin/gradlew -p paper-plugin clean build
      - name: Backup, upload verified JAR, and request restart
        run: python3 paper-vehicles/deploy/falix_deploy_sync_fix.py vehicle-plugin-1.21.4/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
