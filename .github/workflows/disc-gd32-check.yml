name: Check disc harrow integration
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths:
      - '.github/workflows/disc-gd32-check.yml'
      - 'vehicle-plugin-horizon/tools/smoke_disc_gd32.*'
      - 'vehicle-plugin-horizon/paper-plugin/**'
      - 'vehicle-plugin-horizon/next-vehicle/utb/disc_gd32/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate models and pack
        run: cd vehicle-plugin-horizon/next-vehicle/utb/disc_gd32 && python3 -m unittest test_geometry test_models test_pack
      - name: Build and test plugin
        run: ./vehicle-plugin-horizon/paper-plugin/gradlew -p vehicle-plugin-horizon/paper-plugin clean build
      - name: Exercise harrow on disposable Paper server
        run: |
          npm install --prefix /tmp/horizon-test mineflayer@4.39.0
          export NODE_PATH=/tmp/horizon-test/node_modules
          set -o pipefail
          python3 vehicle-plugin-horizon/tools/smoke_disc_gd32.py vehicle-plugin-horizon/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar 2>&1 | tee /tmp/disc.log || {
            python3 -c "from pathlib import Path; print('::error::'+' | '.join(Path('/tmp/disc.log').read_text().splitlines()[-30:]).replace('%','%25')[:10000])"
            exit 1
          }
