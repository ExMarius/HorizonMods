name: Deploy Paper development plugin

# Deliberate request only. A commit adding/changing this marker is the way to
# trigger a branch-only workflow if workflow_dispatch isn't available there.
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper-vehicles/deploy-request.txt'

permissions:
  contents: read

concurrency:
  group: paper-vehicles-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/arena/fb5f91ff-horizonmods'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build and SFTP dependencies
        run: python3 -m pip install Pillow==11.3.0 paramiko==3.5.1
      - name: Run tests and build development JAR
        run: |
          python3 -m unittest discover -s paper-vehicles/tests -v
          ./paper-vehicles/gradlew -p paper-vehicles build
      - name: Upload verified JAR without restarting server
        env:
          SFTP_USERNAME: ${{ secrets.HIDENCLOUD_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.HIDENCLOUD_SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.HIDENCLOUD_SFTP_PRIVATE_KEY }}
          SFTP_HOST_KEY_SHA256: ${{ secrets.HIDENCLOUD_SFTP_HOST_KEY_SHA256 }}
        run: python3 paper-vehicles/deploy/upload.py paper-vehicles/build/libs/HorizonVehiclesPaper-0.1.0-dev.jar
