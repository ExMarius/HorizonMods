name: Install r41 plugin on Falix
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: [.github/workflows/falix-install-r41.yml, paper-vehicles/deploy/falix_install_r41.py]
permissions:
  contents: read
  id-token: write
jobs:
  install:
    if: github.ref == 'refs/heads/arena/fb5f91ff-horizonmods' && startsWith(github.event.head_commit.message, 'Deploy stable r41 plugin to Falix')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Disable incompatible 26.3 pack in 1.21.4 build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('vehicle-plugin/paper-plugin/src/main/resources/config.yml')
          s = p.read_text()
          s, urls = re.subn(r'(?m)^(  url:) ".*"$', r'\1 ""', s, count=1)
          s, hashes = re.subn(r'(?m)^(  sha1:) ".*"$', r'\1 ""', s, count=1)
          assert urls == hashes == 1
          p.write_text(s)
          PY
      - name: Build and test for Paper 1.21.4
        working-directory: vehicle-plugin
        run: ./paper-plugin/gradlew -p paper-plugin clean build -PpaperApi=1.21.4-R0.1-SNAPSHOT -PjavaVersion=21
      - name: Upload and verify plugin without starting server
        run: python3 paper-vehicles/deploy/falix_install_r41.py vehicle-plugin/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
