name: Build stable vehicle plugin for Paper 1.21.4
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths: [.github/workflows/falix-build-r41.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test Paper 1.21.4
        working-directory: vehicle-plugin
        run: |
          ./paper-plugin/gradlew -p paper-plugin clean build -PpaperApi=1.21.4-R0.1-SNAPSHOT -PjavaVersion=21
      - uses: actions/upload-artifact@v4
        with:
          name: vehicle-plugin-paper-1.21.4-r41
          path: vehicle-plugin/paper-plugin/build/libs/*.jar
          if-no-files-found: error
