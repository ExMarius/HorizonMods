name: Update vehicle plugin on Falix
on:
  push:
    branches: [arena/fb5f91ff-horizonmods]
    paths:
      - 'vehicle-plugin/paper-plugin/src/**'
      - 'vehicle-plugin/paper-plugin/build.gradle.kts'
      - 'vehicle-plugin/paper-plugin/settings.gradle.kts'
      - 'vehicle-plugin/paper-plugin/gradle/**'
      - 'vehicle-plugin/paper-plugin/gradlew'
permissions:
  contents: read
  id-token: write
concurrency:
  group: falix-vehicle-deploy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Do not ship 26.3 pack URL in the 1.21.4 build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('vehicle-plugin/paper-plugin/src/main/resources/config.yml')
          s = p.read_text()
          if 'MrCrayfishVehiclePlugin-resource-pack-26.3-r41.zip' in s:
              s, urls = re.subn(r'(?m)^(  url:) "[^"\n]*MrCrayfishVehiclePlugin-resource-pack-26\.3-r41\.zip"$', r'\1 ""', s, count=1)
              s, hashes = re.subn(r'(?m)^(  sha1:) "[^"]*"$', r'\1 ""', s, count=1)
              assert urls == hashes == 1
              p.write_text(s)
          PY
      - name: Test deployment safety checks
        run: python3 -m unittest discover -s paper-vehicles/tests -p test_falix_auto_update.py -v
      - name: Build and run tests before updating
        working-directory: vehicle-plugin
        run: ./paper-plugin/gradlew -p paper-plugin clean build -PpaperApi=1.21.4-R0.1-SNAPSHOT -PjavaVersion=21
      - name: Back up, upload, verify and restart
        run: python3 paper-vehicles/deploy/falix_auto_update.py vehicle-plugin/paper-plugin/build/libs/MrCrayfishVehiclePlugin-0.1.0-SNAPSHOT.jar
